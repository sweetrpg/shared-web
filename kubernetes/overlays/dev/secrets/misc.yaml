---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: shared-web-misc

spec:
    refreshInterval: 12h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-misc
        creationPolicy: Owner
    dataFrom:
        # Was /sweetrpg/support/assets/web/misc - a copy-paste leftover from assets-web's own
        # scaffolding, pointing at a different service's secret path entirely.
        - extract:
              key: /sweetrpg/shared/web/misc
