---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-shared

resources:
    - ../../base
    - configmaps.yaml
    - destination-rules.yaml
    - secrets.yaml

commonLabels:
    app: web
    version: v1
    platform: sweetrpg
    package: shared
    component: web

generatorOptions:
    disableNameSuffixHash: true

images:
  - name: shared-web
    newName: ghcr.io/sweetrpg/shared-web
    newTag: latest
