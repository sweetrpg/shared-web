---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-shared

resources:
    - ../../base
    - configmaps.yaml
    - secrets/misc.yaml
    - secrets/cache.yaml

labels:
    - pairs:
        app: web
        version: v1
        platform: sweetrpg
        package: shared
        component: web

generatorOptions:
    disableNameSuffixHash: true

images:
  - name: shared-web
    newName: ghcr.io/sweetrpg/shared-web
    newTag: latest
