---
apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret

metadata:
    name: shared-web-auth
    namespace: sweetrpg-support

spec:
    externalSecretName: shared-web-auth

    namespaceSelector:
        matchLabels:
            name: sweetrpg-support

    refreshTime: 1m

    externalSecretSpec:
        refreshInterval: "1h"
        secretStoreRef:
            name: akeyless
            kind: ClusterSecretStore
        target:
            name: shared-web-auth
            creationPolicy: Owner
        dataFrom:
            - extract:
                  key: Auth0

