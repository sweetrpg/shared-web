---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: shared-web-auth

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: shared-web-auth
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: Auth0

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: shared-web-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: shared-web-misc
        creationPolicy: Owner
    dataFrom:
        # Was /sweetrpg/support/assets/web/misc - a copy-paste leftover from assets-web's own
        # scaffolding, pointing at a different service's secret path entirely.
        - extract:
              key: /sweetrpg/shared/web/misc

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: shared-web-cache

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: shared-web-cache
        creationPolicy: Owner
    dataFrom:
        # Was /sweetrpg/support/cache/client - a stale reference to the retired
        # sweetrpg-support namespace's old shared multi-tenant Redis. shared-web now has its
        # own dedicated cache instance (support/infrastructure's shared/cache module); this
        # matches that module's own redis-auth secret's Akeyless path.
        - extract:
              key: /sweetrpg/shared/cache/auth

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: shared-web-files

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: shared-web-files
        creationPolicy: Owner
        template:
            type: Opaque
            data:
                newrelic.ini: "{{ .contents | toString }}"
    data:
        - secretKey: contents
          remoteRef:
              key: NewRelic
