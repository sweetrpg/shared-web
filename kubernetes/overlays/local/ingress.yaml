---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
    name: web-v1
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.middlewares: sweetrpg-shared-errors-shared-web@kubernetescrd,sweetrpg-shared-strip-prefix-web@kubernetescrd
        kubernetes.io/ingress.class: traefik

spec:
    ingressClassName: traefik
    rules:
        - host: sweetrpg.local
          http:
              paths:
                  - pathType: Prefix
                    path: /shared
                    backend:
                        service:
                            name: web-v1
                            port:
                                name: http
