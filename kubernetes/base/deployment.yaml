---
apiVersion: apps/v1
kind: Deployment

metadata:
    name: shared-web-v1

spec:
    replicas: 1
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 1
        type: RollingUpdate
    selector:
        matchLabels:
            platform: sweetrpg
            app: shared-web
            component: web
            package: shared
            version: v1
    template:
        metadata:
            labels:
                platform: sweetrpg
                app: shared-web
                component: web
                package: shared
                version: v1
        spec:
            serviceAccountName: shared-web
            imagePullSecrets:
                - name: sweetrpg-registry
            containers:
                - name: app
                  image: ghcr.io/sweetrpg/shared-web:latest
                  imagePullPolicy: Always
                  envFrom:
                      - configMapRef:
                            name: shared-web-common
                      - configMapRef:
                            name: shared-web-env
                      - secretRef:
                            name: shared-web-auth
                      - secretRef:
                            name: shared-web-misc
                      - secretRef:
                            name: shared-web-cache
                  env: []
                  ports:
                      - containerPort: 8081
                        name: http
                  resources:
                      requests:
                          cpu: "20m"
                          memory: "55m"
                      limits:
                          cpu: "1.0"
                          memory: "1Gi"
                  #   livenessProbe:
                  #       httpGet:
                  #           path: /health/ping
                  #           port: 8081
                  #       initialDelaySeconds: 90
                  #       timeoutSeconds: 10
                  #   readinessProbe:
                  #       httpGet:
                  #           path: /health/ping
                  #           port: 8081
                  #       initialDelaySeconds: 30
                  #       timeoutSeconds: 10
                  volumeMounts:
                      - mountPath: /data
                        name: data
                      - mountPath: /config
                        name: config
            volumes:
                - name: config
                  secret:
                      secretName: shared-web-files
                      items:
                          - key: newrelic.ini
                            path: newrelic.ini
                - name: data
                  emptyDir: {}
            restartPolicy: Always
