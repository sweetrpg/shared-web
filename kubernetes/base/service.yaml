---
kind: Service
apiVersion: v1

metadata:
    name: shared-web-v1
    annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"

spec:
    selector:
        platform: sweetrpg
        app: shared-web
        component: web
        package: shared
        version: v1
    type: LoadBalancer
    ports:
        - name: http
          port: 8081
          targetPort: http
