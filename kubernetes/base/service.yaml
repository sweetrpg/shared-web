---
kind: Service
apiVersion: v1

metadata:
    name: web-v1
    annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"

spec:
    selector:
        app.kubernetes.io/name: shared-web
        app.kubernetes.io/version: v1
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: shared
    type: ClusterIP
    ports:
        - name: http
          port: 8081
          targetPort: http
