<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ _('SweetRPG Shared') }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{{ config['SHARED_URL'] }}/static/img/main/favicon.png">
    <link rel="stylesheet" href="{{ config['SHARED_URL'] }}/static/css/main.css">
    <script>
    /* Applied synchronously, before first paint, so the page never flashes the wrong theme -
       same anti-flash bootstrap every other frontend runs (see main-web's templates/main.html). */
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('sweetrpg_theme_v1'); } catch (e) {}
      var theme = stored || 'system';
      var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
    </script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .landing {
            max-width: 480px;
            padding: 0 clamp(20px, 5vw, 64px);
            text-align: center;
        }
        .landing h1 { margin: 0 0 12px; }
    </style>
</head>
<body>
    <div class="landing">
        <h1>{{ _('SweetRPG Shared') }}</h1>
        <p class="text-muted">{{ _('Serves shared branding assets, error pages, and maintenance notices for the SweetRPG platform.') }}</p>
        <p class="text-muted">{{ _('There is nothing to browse here.') }}</p>
    </div>
</body>
</html>
