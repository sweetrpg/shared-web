<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ heading }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #12141a;
            color: #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            max-width: 32rem;
            padding: 2rem;
            text-align: center;
        }
        h1 { margin-bottom: 0.5rem; }
        p { color: #b0b0b0; }
        .meta { margin-top: 1.5rem; font-size: 0.9rem; color: #808080; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ status_code }} - {{ heading }}</h1>
        <p>{{ description }}</p>
        {% if service or request_id %}
        <p class="meta">
            {% if service %}{{ service }}{% endif %}
            {% if service and request_id %} - {% endif %}
            {% if request_id %}Request ID: {{ request_id }}{% endif %}
        </p>
        {% endif %}
    </div>
</body>
</html>
